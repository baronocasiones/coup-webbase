name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install chromium --with-deps

      # No manual "start backend" / "wait-on" / "start frontend" steps.
      #
      # These used to run uvicorn on :8000 and Vite on :5173 in the background,
      # then `npx playwright test` ran with CI=true — which sets
      # reuseExistingServer:false. Playwright therefore tried to launch a second
      # uvicorn and a second Vite on the same two already-bound ports and
      # aborted during webServer startup, before any test executed:
      #
      #   Error: http://localhost:8000/players is already used ...
      #
      # The job failed 100% of the time. The `webServer` block in
      # playwright.config.ts already starts both servers with proper readiness
      # probes and owns their teardown, and it carries ENV=testing for the
      # backend so /test/reset is enabled. Letting a single mechanism own the
      # lifecycle removes the collision by construction.
      - name: Run E2E tests
        run: cd frontend && npx playwright test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
